package:
  name: '{{ PACKAGE_NAME }}'
  version: '{{ PACKAGE_VERSION }}'

source:
  path: ../src

requirements:
  run:
    # Foundry Jupyter Workspace / Linux x86-64
    - python 3.13.*
    - ipykernel
    - pip
    - foundry-transforms-lib-python
    - streamlit==1.55.0

    # LangChain and provider integrations
    # Original: langchain-core==1.2.20
    # Updated to satisfy langchain-community dependency requirements.
    - langchain-core>=1.4,<2
    - langchain-community>=0.4,<0.5
    - langchain-text-splitters==1.1.1
    - langchain-openai==1.1.11
    - langchain-google-genai
    - langchain-mistralai
    - langchain-huggingface
    - langchain-chroma
    - langchain-pinecone

    # Google APIs and authentication
    - google-api-python-client
    - google-auth-httplib2
    - google-auth-oauthlib==1.3.0

    # Provider SDKs / HTTP / crawling
    - openai==2.29.0
    - anthropic>=0.40,<1
    - google-genai>=1,<2
    - llama-cpp-python
    - requests>=2.31.0,<3
    - urllib3>=2.0.7,<3
    - beautifulsoup4>=4.12,<5
    - lxml>=5,<6
    - playwright>=1.50,<2
    - yt-dlp>=2025.1.0