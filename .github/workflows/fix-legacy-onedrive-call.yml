name: Fix Legacy OneDrive Call

on:
  push:
    branches:
      - remove-data-management-runtime-fixes-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Align legacy OneDrive loader call'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-data-management-runtime-fixes-v2
          fetch-depth: 0

      - name: Align OneDrive call
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          old = """\t\t\t\t\tloader = OneDriveDocLoader( )
          \t\t\t\t\tif isinstance( onedrive_folder_path, str ) and onedrive_folder_path.strip( ):
          \t\t\t\t\t\tdocuments = loader.load_folder( id=onedrive_drive_id.strip( ),
          \t\t\t\t\t\t\tpath=onedrive_folder_path.strip( ), ) or [ ]
          \t\t\t\t\telse:
          \t\t\t\t\t\tdocuments = loader.load( id=onedrive_drive_id.strip( ), ) or [ ]
          """
          new = """\t\t\t\t\tloader = OneDriveDocLoader( )
          \t\t\t\t\tdocuments = loader.load(
          \t\t\t\t\t\tdrive_id=onedrive_drive_id.strip( ),
          \t\t\t\t\t\tfolder_path=onedrive_folder_path.strip( ) or None,
          \t\t\t\t\t\tobject_ids=None,
          \t\t\t\t\t\tauth_with_token=False ) or [ ]
          """
          if old not in text:
              raise RuntimeError('Legacy OneDrive loader block was not found.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          ast.parse(text, filename='app.py')
          PY

          python -m compileall -q app.py config.py generators.py fetchers.py loaders.py scrapers.py data.py
          rm .github/workflows/fix-legacy-onedrive-call.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align legacy OneDrive loader call"
          git push origin HEAD:remove-data-management-runtime-fixes-v2
