name: Fix Surviving Wrapper Contracts

on:
  push:
    branches:
      - remove-data-management-runtime-fixes-v2

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix surviving UI wrapper contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-data-management-runtime-fixes-v2
          fetch-depth: 0

      - name: Correct loader wrapper contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          def replace_class_method(text: str, class_name: str, method_name: str,
                                   replacement: str) -> str:
              tree = ast.parse(text)
              class_node = next(
                  (node for node in tree.body
                   if isinstance(node, ast.ClassDef) and node.name == class_name),
                  None,
              )
              if class_node is None:
                  raise RuntimeError(f'Class not found: {class_name}')
              method_node = next(
                  (node for node in class_node.body
                   if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                   and node.name == method_name),
                  None,
              )
              if method_node is None:
                  raise RuntimeError(f'Method not found: {class_name}.{method_name}')
              lines = text.splitlines(keepends=True)
              start = method_node.lineno - 1
              end = method_node.end_lineno
              return ''.join(lines[:start]) + replacement.rstrip() + '\n\n' + ''.join(lines[end:])

          # ------------------------------------------------------------------
          # app.py — disambiguate the loader WebCrawler from fetchers.WebCrawler
          # ------------------------------------------------------------------
          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          old_loader_tail = 'EmailLoader, SpfxLoader)'
          new_loader_tail = 'EmailLoader, SpfxLoader, WebCrawler as LoaderWebCrawler)'
          if old_loader_tail not in app:
              raise RuntimeError('Loader import tail was not found.')
          app = app.replace(old_loader_tail, new_loader_tail, 1)

          old_crawler = 'loader = WebCrawler( url=start_url.strip( ), recursive=True,'
          new_crawler = 'loader = LoaderWebCrawler( url=start_url.strip( ), recursive=True,'
          if old_crawler not in app:
              raise RuntimeError('Loading-mode WebCrawler construction was not found.')
          app = app.replace(old_crawler, new_crawler, 1)
          app_path.write_text(app, encoding='utf-8')

          # ------------------------------------------------------------------
          # loaders.py — expose the controls already present in the UI
          # ------------------------------------------------------------------
          loaders_path = Path('loaders.py')
          loaders = loaders_path.read_text(encoding='utf-8')

          aws_file_load = '''\tdef load( self, bucket: str, key: str, aws_access_key_id: Optional[ str ] = None,
          \t\taws_secret_access_key: Optional[ str ] = None,
          \t\taws_session_token: Optional[ str ] = None,
          \t\tregion_name: Optional[ str ] = None, api_version: Optional[ str ] = None,
          \t\tuse_ssl: bool = True, verify: str | bool | None = None,
          \t\tendpoint_url: Optional[ str ] = None ) -> List[ Document ] | None:
          \t\t"""Load an Amazon S3 object.

          \t\tPurpose:
          \t\t\tLoads one S3 object through ``S3FileLoader`` while preserving the connection,
          \t\t\tcredential, SSL, and endpoint controls exposed by the Streamlit UI.

          \t\tArgs:
          \t\t\tbucket (str): S3 bucket containing the object.
          \t\t\tkey (str): S3 object key to load.
          \t\t\taws_access_key_id (Optional[str]): Optional AWS access key identifier.
          \t\t\taws_secret_access_key (Optional[str]): Optional AWS secret access key.
          \t\t\taws_session_token (Optional[str]): Optional AWS session token.
          \t\t\tregion_name (Optional[str]): Optional AWS region name.
          \t\t\tapi_version (Optional[str]): Optional S3 API version.
          \t\t\tuse_ssl (bool): Whether the S3 client uses SSL.
          \t\t\tverify (str | bool | None): SSL certificate verification setting.
          \t\t\tendpoint_url (Optional[str]): Optional custom S3 endpoint URL.

          \t\tReturns:
          \t\t\tList[Document] | None: Documents loaded from the selected S3 object.

          \t\tRaises:
          \t\t\tError: Wraps, logs, and re-raises source failures with Foo metadata.
          \t\t"""
          \t\ttry:
          \t\t\tthrow_if( 'bucket', bucket )
          \t\t\tthrow_if( 'key', key )
          \t\t\tself.bucket = bucket
          \t\t\tself.key = key
          \t\t\tself.aws_access_key_id = aws_access_key_id
          \t\t\tself.aws_secret_access_key = aws_secret_access_key
          \t\t\tself.aws_session_token = aws_session_token
          \t\t\tself.region_name = region_name
          \t\t\tself.api_version = api_version
          \t\t\tself.use_ssl = use_ssl
          \t\t\tself.verify = verify
          \t\t\tself.endpoint_url = endpoint_url
          \t\t\tself.loader = S3FileLoader(
          \t\t\t\tself.bucket,
          \t\t\t\tself.key,
          \t\t\t\tregion_name=self.region_name,
          \t\t\t\tapi_version=self.api_version,
          \t\t\t\tuse_ssl=self.use_ssl,
          \t\t\t\tverify=self.verify,
          \t\t\t\tendpoint_url=self.endpoint_url,
          \t\t\t\taws_access_key_id=self.aws_access_key_id,
          \t\t\t\taws_secret_access_key=self.aws_secret_access_key,
          \t\t\t\taws_session_token=self.aws_session_token )
          \t\t\tself.documents = self.loader.load( )
          \t\t\treturn self.documents
          \t\texcept Exception as e:
          \t\t\texception = Error( e )
          \t\t\texception.module = 'loaders'
          \t\t\texception.cause = 'AwsFileLoader'
          \t\t\texception.method = 'load( self, bucket: str, key: str, ... )'
          \t\t\tLogger( ).write( exception )
          \t\t\traise exception
          '''
          loaders = replace_class_method(loaders, 'AwsFileLoader', 'load', aws_file_load)

          aws_bucket_load = '''\tdef load( self, bucket: str, prefix: Optional[ str ] = None,
          \t\taws_access_key_id: Optional[ str ] = None,
          \t\taws_secret_access_key: Optional[ str ] = None,
          \t\taws_session_token: Optional[ str ] = None,
          \t\tregion_name: Optional[ str ] = None, endpoint_url: Optional[ str ] = None,
          \t\tapi_version: Optional[ str ] = None, use_ssl: bool = True,
          \t\tverify: str | bool | None = None ) -> List[ Document ] | None:
          \t\t"""Load an Amazon S3 directory.

          \t\tPurpose:
          \t\t\tLoads objects beneath an S3 prefix through ``S3DirectoryLoader`` while preserving
          \t\t\tthe connection, credential, SSL, and endpoint controls exposed by the UI.

          \t\tArgs:
          \t\t\tbucket (str): S3 bucket containing the requested objects.
          \t\t\tprefix (Optional[str]): Optional object-key prefix used to restrict loading.
          \t\t\taws_access_key_id (Optional[str]): Optional AWS access key identifier.
          \t\t\taws_secret_access_key (Optional[str]): Optional AWS secret access key.
          \t\t\taws_session_token (Optional[str]): Optional AWS session token.
          \t\t\tregion_name (Optional[str]): Optional AWS region name.
          \t\t\tendpoint_url (Optional[str]): Optional custom S3 endpoint URL.
          \t\t\tapi_version (Optional[str]): Optional S3 API version.
          \t\t\tuse_ssl (bool): Whether the S3 client uses SSL.
          \t\t\tverify (str | bool | None): SSL certificate verification setting.

          \t\tReturns:
          \t\t\tList[Document] | None: Documents loaded beneath the selected prefix.

          \t\tRaises:
          \t\t\tError: Wraps, logs, and re-raises source failures with Foo metadata.
          \t\t"""
          \t\ttry:
          \t\t\tthrow_if( 'bucket', bucket )
          \t\t\tself.bucket = bucket
          \t\t\tself.prefix = prefix
          \t\t\tself.aws_access_key_id = aws_access_key_id
          \t\t\tself.aws_secret_access_key = aws_secret_access_key
          \t\t\tself.aws_session_token = aws_session_token
          \t\t\tself.region_name = region_name
          \t\t\tself.endpoint_url = endpoint_url
          \t\t\tself.api_version = api_version
          \t\t\tself.use_ssl = use_ssl
          \t\t\tself.verify = verify
          \t\t\tself.loader = S3DirectoryLoader(
          \t\t\t\tself.bucket,
          \t\t\t\tprefix=self.prefix or '',
          \t\t\t\tregion_name=self.region_name,
          \t\t\t\tapi_version=self.api_version,
          \t\t\t\tuse_ssl=self.use_ssl,
          \t\t\t\tverify=self.verify,
          \t\t\t\tendpoint_url=self.endpoint_url,
          \t\t\t\taws_access_key_id=self.aws_access_key_id,
          \t\t\t\taws_secret_access_key=self.aws_secret_access_key,
          \t\t\t\taws_session_token=self.aws_session_token )
          \t\t\tself.documents = self.loader.load( )
          \t\t\treturn self.documents
          \t\texcept Exception as e:
          \t\t\texception = Error( e )
          \t\t\texception.module = 'loaders'
          \t\t\texception.cause = 'AwsBucketLoader'
          \t\t\texception.method = 'load( self, bucket: str, prefix: Optional[ str ], ... )'
          \t\t\tLogger( ).write( exception )
          \t\t\traise exception
          '''
          loaders = replace_class_method(loaders, 'AwsBucketLoader', 'load', aws_bucket_load)

          onedrive_load = '''\tdef load( self, drive_id: str, folder_path: Optional[ str ],
          \t\tobject_ids: Optional[ List[ str ] ], auth_with_token: bool ) -> List[ Document ] | None:
          \t\t"""Load Microsoft OneDrive documents.

          \t\tPurpose:
          \t\t\tLoads OneDrive content by drive, optional folder path, or optional object identifiers
          \t\t\twhile preserving the token-authentication control exposed by the Streamlit UI.

          \t\tArgs:
          \t\t\tdrive_id (str): OneDrive drive identifier.
          \t\t\tfolder_path (Optional[str]): Optional folder path within the drive.
          \t\t\tobject_ids (Optional[List[str]]): Optional OneDrive object identifiers to load.
          \t\t\tauth_with_token (bool): Whether OneDrive authentication uses the saved token flow.

          \t\tReturns:
          \t\t\tList[Document] | None: Documents loaded from OneDrive.

          \t\tRaises:
          \t\t\tError: Wraps, logs, and re-raises source failures with Foo metadata.
          \t\t"""
          \t\ttry:
          \t\t\tthrow_if( 'drive_id', drive_id )
          \t\t\tself.drive_id = drive_id
          \t\t\tself.folder_path = folder_path
          \t\t\tself.object_ids = object_ids
          \t\t\tself.auth_with_token = auth_with_token
          \t\t\tself.loader = OneDriveLoader(
          \t\t\t\tdrive_id=self.drive_id,
          \t\t\t\tfolder_path=self.folder_path,
          \t\t\t\tobject_ids=self.object_ids,
          \t\t\t\tauth_with_token=self.auth_with_token )
          \t\t\tself.documents = self.loader.load( )
          \t\t\treturn self.documents
          \t\texcept Exception as e:
          \t\t\texception = Error( e )
          \t\t\texception.module = 'loaders'
          \t\t\texception.cause = 'OneDriveDocLoader'
          \t\t\texception.method = 'load( self, drive_id: str, folder_path: Optional[ str ], object_ids: Optional[ List[ str ] ], auth_with_token: bool )'
          \t\t\tLogger( ).write( exception )
          \t\t\traise exception
          '''
          loaders = replace_class_method(loaders, 'OneDriveDocLoader', 'load', onedrive_load)
          loaders_path.write_text(loaders, encoding='utf-8')

          # Verification
          ast.parse(app_path.read_text(encoding='utf-8'), filename='app.py')
          ast.parse(loaders_path.read_text(encoding='utf-8'), filename='loaders.py')
          PY

          python -m compileall -q app.py config.py generators.py fetchers.py loaders.py scrapers.py data.py

          rm .github/workflows/fix-surviving-wrapper-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix surviving UI wrapper contracts"
          git push origin HEAD:remove-data-management-runtime-fixes-v2
