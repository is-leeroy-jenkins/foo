name: Refactor Data Management

on:
  push:
    branches:
      - remove-data-management-runtime-fixes

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message != 'Remove Data Management and fix runtime blockers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-data-management-runtime-fixes
          fetch-depth: 0

      - name: Apply source refactor
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          TARGET_MODES = {
              'Data Browse', 'Data Upload', 'CRUD Ops',
              'Data Filter', 'Data Aggregation', 'SQL Console',
          }

          def replace_function(text: str, name: str, replacement: str) -> str:
              tree = ast.parse(text)
              node = next((item for item in tree.body
                           if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))
                           and item.name == name), None)
              if node is None:
                  raise RuntimeError(f'Function not found: {name}')
              lines = text.splitlines(keepends=True)
              return ''.join(lines[:node.lineno - 1]) + replacement.rstrip() + '\n\n' + ''.join(lines[node.end_lineno:])

          def remove_mode_branches(text: str) -> str:
              lines = text.splitlines(keepends=True)
              output: list[str] = []
              removed: set[str] = set()
              index = 0
              while index < len(lines):
                  line = lines[index]
                  match = re.fullmatch(r"(?:if|elif) mode == ['\"]([^'\"]+)['\"]:", line.strip())
                  if match and match.group(1) in TARGET_MODES:
                      removed.add(match.group(1))
                      indent = len(line) - len(line.lstrip(' \t'))
                      index += 1
                      while index < len(lines):
                          candidate = lines[index]
                          if not candidate.strip():
                              index += 1
                              continue
                          if len(candidate) - len(candidate.lstrip(' \t')) <= indent:
                              break
                          index += 1
                      continue
                  output.append(line)
                  index += 1
              missing = TARGET_MODES - removed
              if missing:
                  raise RuntimeError(f'Data Management branches not found: {sorted(missing)}')
              return ''.join(output)

          def remove_dead_database_helpers(text: str) -> str:
              tokens = ('database', 'sqlite', 'crud', 'data_upload', 'schema', 'table')
              while True:
                  tree = ast.parse(text)
                  loaded = {node.id for node in ast.walk(tree)
                            if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)}
                  candidates = [node for node in tree.body
                                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                                and any(token in node.name.lower() for token in tokens)
                                and node.name not in loaded]
                  if not candidates:
                      return text
                  lines = text.splitlines(keepends=True)
                  for node in sorted(candidates, key=lambda value: value.lineno, reverse=True):
                      del lines[node.lineno - 1:node.end_lineno]
                  text = ''.join(lines)

          app_path = Path('app.py')
          app = app_path.read_text(encoding='utf-8')
          app = remove_mode_branches(app)

          old_sidebar = """functionality_modes = [ configured_mode for configured_mode in cfg.MODE_MAP if
          \t\tconfigured_mode not in cfg.DB_MODES ]
          management_modes = list( cfg.DB_MODES )
          active_mode = st.session_state[ 'mode' ]
          if 'functionality_mode' not in st.session_state:
          \tst.session_state[ 'functionality_mode' ] = (
          \t\t\tactive_mode if active_mode in functionality_modes else None)
          if 'management_mode' not in st.session_state:
          \tst.session_state[ 'management_mode' ] = (
          \t\t\tactive_mode if active_mode in management_modes else None)
          """
          new_sidebar = """functionality_modes = list( cfg.MODE_MAP.keys( ) )
          active_mode = st.session_state[ 'mode' ]
          if 'functionality_mode' not in st.session_state:
          \tst.session_state[ 'functionality_mode' ] = (
          \t\t\tactive_mode if active_mode in functionality_modes else None)
          """
          if old_sidebar not in app:
              raise RuntimeError('Sidebar mode-state block not found.')
          app = app.replace(old_sidebar, new_sidebar, 1)

          old_controls = """\tst.radio( label='Mode', options=functionality_modes, index=None,
          \t\t\tkey='functionality_mode', label_visibility='collapsed',
          \t\t\ton_change=set_sidebar_mode, args=('functionality_mode', 'management_mode') )
          \t
          \tst.divider( )
          \t
          \t# ------------- Data -------------
          \tst.text( '🗄️ Data' )
          \twith st.expander( label='Management', expanded=False ):
          \t\tst.radio( label='Management Mode', options=management_modes, index=None,
          \t\t\tkey='management_mode', label_visibility='collapsed',
          \t\t\ton_change=set_sidebar_mode, args=( 'management_mode', 'functionality_mode') )
          """
          new_controls = """\tst.radio( label='Mode', options=functionality_modes, index=None,
          \t\t\tkey='functionality_mode', label_visibility='collapsed',
          \t\t\ton_change=set_sidebar_mode, args=('functionality_mode',) )
          """
          if old_controls not in app:
              raise RuntimeError('Management controls not found.')
          app = app.replace(old_controls, new_controls, 1)

          app = replace_function(app, 'set_sidebar_mode', '''def set_sidebar_mode( source_key: str ) -> None:
          \t"""Set the active application mode from the sidebar radio group.

          \tPurpose:
          \t\tPreserves one authoritative application mode from the functionality selector.

          \tArgs:
          \t\tsource_key (str): Session-state key containing the selected mode.

          \tReturns:
          \t\tNone: This function updates Streamlit session state.
          \t"""
          \tthrow_if( 'source_key', source_key )
          \tselected_mode = st.session_state.get( source_key )
          \tif selected_mode:
          \t\tst.session_state[ 'mode' ] = selected_mode
          ''')

          app = replace_function(app, '_invoke_provider', '''def _invoke_provider( fetcher: Any, prompt: str, params: dict[ str, Any ] ) -> Any:
          \t"""Invoke a provider through its public text-generation contract.

          \tPurpose:
          \t\tExecutes one request without retrying a caught ``TypeError`` under a guessed signature.

          \tArgs:
          \t\tfetcher (Any): Provider wrapper exposing ``generate_text``.
          \t\tprompt (str): Prompt submitted to the provider wrapper.
          \t\tparams (dict[str, Any]): Generation parameters supplied by the UI.

          \tReturns:
          \t\tAny: Provider result returned by ``generate_text``.

          \tRaises:
          \t\tRuntimeError: Raised when the wrapper does not expose ``generate_text``.
          \t"""
          \tthrow_if( 'fetcher', fetcher )
          \tthrow_if( 'prompt', prompt )
          \tif not hasattr( fetcher, 'generate_text' ) or not callable( getattr( fetcher, 'generate_text' ) ):
          \t\traise RuntimeError(
          \t\t\tf"Provider '{type( fetcher ).__name__}' does not expose generate_text." )
          \tfn = getattr( fetcher, 'generate_text' )
          \tsafe = filter_kwargs_for_callable( fn, params )
          \treturn fn( prompt, **safe )
          ''')

          app = remove_dead_database_helpers(app)
          if "import sqlite3\n" in app and not re.search(r'\bsqlite3\b', app.replace('import sqlite3\n', '')):
              app = app.replace('import sqlite3\n', '')
          if "from sqlite3 import Connection\n" in app and not re.search(r'\bConnection\b', app.replace('from sqlite3 import Connection\n', '')):
              app = app.replace('from sqlite3 import Connection\n', '')
          app_path.write_text(app, encoding='utf-8')

          config_path = Path('config.py')
          config = config_path.read_text(encoding='utf-8')
          config = config.replace("OPENSKY_API_CLIENT_SECRET = os.getenv( 'OPENSKY_API_CLIENT_ID' )",
                                  "OPENSKY_API_CLIENT_SECRET = os.getenv( 'OPENSKY_API_CLIENT_SECRET' )")
          config = config.replace("'Environmntal'", "'Environmental'")
          config = re.sub(r"\nDB_MODES = \[ 'Data Browse','Data Upload', 'CRUD Ops', 'Data Filter',\n\t'Data Aggregation', 'SQL Console' \]\n", "\n", config, count=1)
          for mode in TARGET_MODES:
              config = re.sub(rf"\n\t\t'{re.escape(mode)}': '[^']*',?", '', config)

          remaining_app = app_path.read_text(encoding='utf-8')
          for key in ('active_table', 'data_connection', 'df_tables', 'df_schema', 'df_preview', 'df_count'):
              if re.search(rf"['\"]{re.escape(key)}['\"]", remaining_app) is None:
                  config = re.sub(rf"\n\t\t'{re.escape(key)}': [^\n]+,", '', config)
          config_path.write_text(config, encoding='utf-8')

          generators_path = Path('generators.py')
          generators = generators_path.read_text(encoding='utf-8')
          claude_budget_anchor = """\t\t\tif thinking and self.supports_thinking( self.model ):
          \t\t\t\t_budget = self.thinking_budget if self.thinking_budget is not None else 1024
          \t\t\t\tif _budget < 1024:
          \t\t\t\t\t_budget = 1024
          """
          claude_budget_replacement = """\t\t\tif thinking and self.supports_thinking( self.model ):
          \t\t\t\t_budget = self.thinking_budget if self.thinking_budget is not None else 1024
          \t\t\t\tif _budget < 1024:
          \t\t\t\t\t_budget = 1024
          \t\t\t\tif _budget >= self.max_tokens:
          \t\t\t\t\traise ValueError( 'Thinking Budget must be less than Max Tokens.' )
          """
          if claude_budget_anchor not in generators:
              raise RuntimeError('Claude thinking-budget contract not found.')
          generators = generators.replace(claude_budget_anchor, claude_budget_replacement, 1)
          generators_path.write_text(generators, encoding='utf-8')

          def remove_section(text: str, heading: str, level: int) -> str:
              hashes = '#' * level
              stop = r'(?=^#{1,' + str(level) + r'}\s|\Z)'
              return re.sub(rf'(?ms)^{re.escape(hashes + " " + heading)}\s*$.*?{stop}', '', text)

          for path in [Path('README.md')] + list(Path('docs').rglob('*.md')):
              if path == Path('docs/data-management.md'):
                  continue
              text = path.read_text(encoding='utf-8')
              text = re.sub(r"(?m)^.*\|\s*\*\*Data Management\*\*\s*\|.*\n?", '', text)
              text = re.sub(r"(?m)^.*\|\s*Data Management\s*\|.*\n?", '', text)
              text = remove_section(text, '🗄️ Data Management', 2)
              text = remove_section(text, '🗄️ Data Management Mode', 2)
              text = remove_section(text, '🛡️ Safe Data Management', 2)
              text = remove_section(text, 'Manage SQLite Data', 3)
              text = text.replace('Data Management mode', 'the persistence API')
              text = text.replace('data-management UI', 'persistence API')
              text = text.replace('data-management workflows', 'persistence workflows')
              text = text.replace('Data-management workflows', 'Persistence workflows')
              text = text.replace('Relationship to Data Management', 'Relationship to Persistence')
              text = text.replace('SQLite data-management workspace', 'data-processing workspace')
              path.write_text(text, encoding='utf-8')

          mkdocs_path = Path('mkdocs.yml')
          mkdocs = mkdocs_path.read_text(encoding='utf-8')
          mkdocs = re.sub(r"(?m)^\s*- Data Management:\s*data-management\.md\s*\n", '', mkdocs)
          mkdocs_path.write_text(mkdocs, encoding='utf-8')
          Path('docs/data-management.md').unlink(missing_ok=True)

          app = app_path.read_text(encoding='utf-8')
          config = config_path.read_text(encoding='utf-8')
          generators = generators_path.read_text(encoding='utf-8')
          for mode in TARGET_MODES:
              if re.search(rf"(?:if|elif) mode == ['\"]{re.escape(mode)}['\"]:", app):
                  raise RuntimeError(f'Remaining Data Management branch: {mode}')
              if f"'{mode}':" in config:
                  raise RuntimeError(f'Remaining MODE_MAP entry: {mode}')
          if 'management_mode' in app or 'management_modes' in app or 'cfg.DB_MODES' in app:
              raise RuntimeError('Management selector state remains in app.py.')
          if 'DB_MODES =' in config:
              raise RuntimeError('DB_MODES remains in config.py.')
          if "OPENSKY_API_CLIENT_SECRET = os.getenv( 'OPENSKY_API_CLIENT_ID' )" in config:
              raise RuntimeError('OpenSky client-secret binding remains incorrect.')
          if "'Environmntal'" in config:
              raise RuntimeError('Environmental typo remains.')
          if "Thinking Budget must be less than Max Tokens." not in generators:
              raise RuntimeError('Claude thinking-budget guard was not added.')
          ast.parse(app)
          ast.parse(config)
          ast.parse(generators)
          PY

          python -m compileall -q app.py config.py generators.py fetchers.py loaders.py scrapers.py data.py

          rm .github/workflows/refactor-data-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Data Management and fix runtime blockers"
          git push origin HEAD:remove-data-management-runtime-fixes
