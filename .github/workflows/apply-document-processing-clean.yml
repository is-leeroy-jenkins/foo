name: Apply Document Processing Cleanly

on:
  push:
    branches:
      - feature/document-processing
    paths:
      - .github/workflows/apply-document-processing-clean.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/document-processing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Materialize validated integration transformer
        run: |
          git show e3941b55b68c0b5b49b9d03dea10523f199177b9:.github/apply_document_processing_fix.py > .github/apply_document_processing_fix.py
          git show e3941b55b68c0b5b49b9d03dea10523f199177b9:.github/apply_document_processing_fix_v2.py > .github/apply_document_processing_fix_v2.py
          git show e3941b55b68c0b5b49b9d03dea10523f199177b9:.github/apply_document_processing_fix_v3.py > .github/apply_document_processing_fix_v3.py

      - name: Preserve baseline whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/apply_document_processing_fix.py')
          source = path.read_text(encoding='utf-8')
          target = "    source = normalize_generated_whitespace( source )\n"
          assert target in source
          source = source.replace(target, '', 1)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Apply app integration
        run: python .github/apply_document_processing_fix_v3.py

      - name: Compile updated sources
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in [Path('app.py'), Path('embeddings.py'), Path('stores/vector.py')]:
              source = path.read_text(encoding='utf-8')
              try:
                  compile(source, str(path), 'exec')
              except (SyntaxError, IndentationError) as error:
                  lines = source.splitlines()
                  line = error.lineno or 1
                  start = max(1, line - 8)
                  end = min(len(lines), line + 8)
                  print(f'{path}: {error}')
                  for index in range(start, end + 1):
                      print(f'{index:06d}: {lines[index - 1]!r}')
                  raise
          PY

      - name: Verify integration structure
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('app.py').read_text(encoding='utf-8')
          assert app.count("render_document_processing_inputs( '") == 9
          assert app.count("render_document_processing_actions( '") == 9
          assert app.count('\t\trender_loading_tabs( )') == 1
          assert 'NLP METRIC CALCULATIONS' not in app
          assert "'Local GGUF'" in app
          assert "VECTOR_STORES = [ 'Chroma', 'Pinecone' ]" in app
          assert 'from embeddings import EmbeddingFactory' in app
          assert 'from stores.vector import ChromaStore, PineconeStore' in app
          assert not Path('pipelines.py').exists()
          assert not Path('langchain_pipeline.py').exists()
          PY

      - name: Reject noisy app rewrite
        run: |
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(['git', 'diff', '--numstat', '--', 'app.py'], text=True).strip()
          additions, deletions, path = output.split('\t')
          additions = int(additions)
          deletions = int(deletions)
          print(f'{path}: +{additions}/-{deletions}')
          assert additions < 1500, f'app.py additions are unexpectedly large: {additions}'
          assert deletions < 1500, f'app.py deletions are unexpectedly large: {deletions}'
          PY

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove temporary integration files
        run: |
          rm .github/apply_document_processing_fix.py
          rm .github/apply_document_processing_fix_v2.py
          rm .github/apply_document_processing_fix_v3.py
          rm .github/workflows/apply-document-processing-clean.yml

      - name: Commit integrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate document chunking embeddings and vector storage"
          git push origin HEAD:feature/document-processing
