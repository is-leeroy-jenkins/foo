name: NOAA ClimateData and NASA EONET contracts

on:
  pull_request:
    paths:
      - fetchers.py
      - tests/test_climatedata_eonet_contracts.py
      - .github/workflows/climatedata-eonet-contracts.yml
  push:
    paths:
      - fetchers.py
      - tests/test_climatedata_eonet_contracts.py
      - .github/workflows/climatedata-eonet-contracts.yml

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile fetchers
        run: python -m py_compile fetchers.py
      - name: Run provider regression suite
        run: python -m unittest discover -s tests -p 'test_climatedata_eonet_contracts.py' -v
