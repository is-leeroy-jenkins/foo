name: NASA OpenScience OSDR contracts

on:
  pull_request:
    paths:
      - fetchers.py
      - tests/test_openscience_osdr_contracts.py
      - .github/workflows/openscience-osdr-contracts.yml
  push:
    branches: [ main ]
    paths:
      - fetchers.py
      - tests/test_openscience_osdr_contracts.py
      - .github/workflows/openscience-osdr-contracts.yml
  workflow_dispatch:

jobs:
  openscience:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile source and regression tests
        run: python -m compileall -q fetchers.py tests/test_openscience_osdr_contracts.py
      - name: Run isolated OpenScience tests
        run: python -m unittest discover -s tests -p 'test_openscience_osdr_contracts.py' -v
