name: Apply LangChain Loading Integration

on:
  push:
    branches:
      - feature/langchain-chunking-embeddings-vector-store
    paths:
      - .github/workflows/apply-langchain-loading-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/langchain-chunking-embeddings-vector-store
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply anchored app integration
        run: python tools/apply_langchain_loading_integration_v2.py

      - name: Compile updated sources
        run: python -m py_compile app.py langchain_pipeline.py stores/vector.py

      - name: Verify integration markers
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('app.py').read_text(encoding='utf-8')
          assert source.count('render_langchain_inputs(') == 10
          assert source.count('render_langchain_actions(') == 10
          assert source.count('render_loading_tabs( )') == 1
          assert "st.tabs( [ 'Document', 'Chunks', 'Embeddings' ] )" in Path('langchain_pipeline.py').read_text(encoding='utf-8')
          PY

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove integration scaffolding
        run: |
          rm tools/apply_langchain_loading_integration.py
          rm tools/apply_langchain_loading_integration_v2.py
          rm .github/workflows/apply-langchain-loading-integration.yml

      - name: Commit integrated application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py langchain_pipeline.py stores/vector.py requirements.txt
          git add -u tools/apply_langchain_loading_integration.py tools/apply_langchain_loading_integration_v2.py .github/workflows/apply-langchain-loading-integration.yml
          git commit -m "Integrate LangChain chunking embeddings and vector storage"
          git push origin HEAD:feature/langchain-chunking-embeddings-vector-store

# Anchored integration retry: 3
