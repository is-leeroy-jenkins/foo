name: Audit Surviving Execution Paths

on:
  push:
    branches:
      - remove-data-management-runtime-fixes-v2

permissions:
  contents: write

jobs:
  audit:
    if: github.event.head_commit.message != 'Record surviving execution path audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-data-management-runtime-fixes-v2
          fetch-depth: 0

      - name: Audit local UI to wrapper contracts
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          service_files = ['loaders.py', 'scrapers.py', 'fetchers.py', 'generators.py']
          class_nodes: dict[str, ast.ClassDef] = {}
          own_methods: dict[str, dict[str, ast.FunctionDef | ast.AsyncFunctionDef]] = {}

          for filename in service_files:
              tree = ast.parse(Path(filename).read_text(encoding='utf-8'), filename=filename)
              for node in tree.body:
                  if isinstance(node, ast.ClassDef):
                      class_nodes[node.name] = node
                      own_methods[node.name] = {
                          member.name: member
                          for member in node.body
                          if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
                      }

          def resolve_methods(class_name: str, seen: set[str] | None = None) -> dict[str, ast.FunctionDef | ast.AsyncFunctionDef]:
              visited = set(seen or set())
              if class_name in visited:
                  return {}
              visited.add(class_name)
              node = class_nodes.get(class_name)
              if node is None:
                  return {}
              methods: dict[str, ast.FunctionDef | ast.AsyncFunctionDef] = {}
              for base in node.bases:
                  if isinstance(base, ast.Name) and base.id in class_nodes:
                      methods.update(resolve_methods(base.id, visited))
              methods.update(own_methods.get(class_name, {}))
              return methods

          class_methods = {name: resolve_methods(name) for name in class_nodes}

          app_path = Path('app.py')
          app_text = app_path.read_text(encoding='utf-8')
          app_tree = ast.parse(app_text, filename='app.py')
          errors: list[dict[str, object]] = []
          checked_calls: list[dict[str, object]] = []

          def signature_bounds(method: ast.FunctionDef | ast.AsyncFunctionDef) -> tuple[int, int | None, set[str], bool]:
              args = method.args
              positional = list(args.posonlyargs) + list(args.args)
              if positional and positional[0].arg in {'self', 'cls'}:
                  positional = positional[1:]
              defaults = len(args.defaults)
              required = max(0, len(positional) - defaults)
              maximum = None if args.vararg is not None else len(positional)
              keywords = {arg.arg for arg in positional} | {arg.arg for arg in args.kwonlyargs}
              return required, maximum, keywords, args.kwarg is not None

          def check_call(node: ast.Call, env: dict[str, str]) -> None:
              if not isinstance(node.func, ast.Attribute) or not isinstance(node.func.value, ast.Name):
                  return
              class_name = env.get(node.func.value.id)
              if class_name is None:
                  return
              method_name = node.func.attr
              method = class_methods.get(class_name, {}).get(method_name)
              if method is None:
                  errors.append({
                      'line': node.lineno,
                      'class': class_name,
                      'method': method_name,
                      'error': 'method does not exist on wrapper class or local base class',
                  })
                  return

              required, maximum, keywords, accepts_kwargs = signature_bounds(method)
              positional_count = len(node.args)
              supplied_keywords = {kw.arg for kw in node.keywords if kw.arg is not None}
              checked_calls.append({
                  'line': node.lineno,
                  'class': class_name,
                  'method': method_name,
                  'positional': positional_count,
                  'keywords': sorted(supplied_keywords),
              })
              if maximum is not None and positional_count > maximum:
                  errors.append({
                      'line': node.lineno,
                      'class': class_name,
                      'method': method_name,
                      'error': f'{positional_count} positional arguments exceed maximum {maximum}',
                  })
              unknown = supplied_keywords - keywords
              if unknown and not accepts_kwargs:
                  errors.append({
                      'line': node.lineno,
                      'class': class_name,
                      'method': method_name,
                      'error': f'unknown keyword arguments: {sorted(unknown)}',
                  })

          def inspect_expression(node: ast.AST | None, env: dict[str, str]) -> None:
              if node is None:
                  return
              for child in ast.walk(node):
                  if isinstance(child, ast.Call):
                      check_call(child, env)

          def assigned_class(value: ast.AST | None) -> str | None:
              if isinstance(value, ast.Call) and isinstance(value.func, ast.Name) and value.func.id in class_methods:
                  return value.func.id
              return None

          def process_block(statements: list[ast.stmt], incoming: dict[str, str]) -> dict[str, str]:
              env = dict(incoming)
              for stmt in statements:
                  if isinstance(stmt, ast.Assign):
                      inspect_expression(stmt.value, env)
                      class_name = assigned_class(stmt.value)
                      for target in stmt.targets:
                          if isinstance(target, ast.Name):
                              if class_name is None:
                                  env.pop(target.id, None)
                              else:
                                  env[target.id] = class_name
                      continue

                  if isinstance(stmt, ast.AnnAssign):
                      inspect_expression(stmt.value, env)
                      if isinstance(stmt.target, ast.Name):
                          class_name = assigned_class(stmt.value)
                          if class_name is None:
                              env.pop(stmt.target.id, None)
                          else:
                              env[stmt.target.id] = class_name
                      continue

                  if isinstance(stmt, ast.AugAssign):
                      inspect_expression(stmt.value, env)
                      continue

                  if isinstance(stmt, ast.Expr):
                      inspect_expression(stmt.value, env)
                      continue

                  if isinstance(stmt, ast.If):
                      inspect_expression(stmt.test, env)
                      process_block(stmt.body, dict(env))
                      process_block(stmt.orelse, dict(env))
                      continue

                  if isinstance(stmt, (ast.For, ast.AsyncFor)):
                      inspect_expression(stmt.iter, env)
                      process_block(stmt.body, dict(env))
                      process_block(stmt.orelse, dict(env))
                      continue

                  if isinstance(stmt, ast.While):
                      inspect_expression(stmt.test, env)
                      process_block(stmt.body, dict(env))
                      process_block(stmt.orelse, dict(env))
                      continue

                  if isinstance(stmt, (ast.With, ast.AsyncWith)):
                      for item in stmt.items:
                          inspect_expression(item.context_expr, env)
                      process_block(stmt.body, dict(env))
                      continue

                  if isinstance(stmt, ast.Try):
                      process_block(stmt.body, dict(env))
                      for handler in stmt.handlers:
                          process_block(handler.body, dict(env))
                      process_block(stmt.orelse, dict(env))
                      process_block(stmt.finalbody, dict(env))
                      continue

                  if isinstance(stmt, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      process_block(stmt.body, {})
                      continue

                  if isinstance(stmt, ast.ClassDef):
                      continue

                  for child in ast.iter_child_nodes(stmt):
                      if isinstance(child, ast.expr):
                          inspect_expression(child, env)
              return env

          process_block(app_tree.body, {})

          mode_keys: list[str] = []
          config_tree = ast.parse(Path('config.py').read_text(encoding='utf-8'), filename='config.py')
          for node in config_tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == 'MODE_MAP' for target in node.targets):
                  if isinstance(node.value, ast.Dict):
                      mode_keys = [key.value for key in node.value.keys if isinstance(key, ast.Constant) and isinstance(key.value, str)]

          branch_modes: set[str] = set()
          for node in ast.walk(app_tree):
              if not isinstance(node, ast.Compare) or len(node.ops) != 1 or not isinstance(node.ops[0], ast.Eq):
                  continue
              if not isinstance(node.left, ast.Name) or node.left.id != 'mode' or len(node.comparators) != 1:
                  continue
              value = node.comparators[0]
              if isinstance(value, ast.Constant) and isinstance(value.value, str):
                  branch_modes.add(value.value)

          missing_branches = sorted(set(mode_keys) - branch_modes)
          stale_branches = sorted(branch_modes - set(mode_keys))
          if missing_branches:
              errors.append({'error': f'MODE_MAP values without execution branches: {missing_branches}'})
          if stale_branches:
              errors.append({'error': f'Execution branches absent from MODE_MAP: {stale_branches}'})

          report = {
              'checked_local_wrapper_calls': len(checked_calls),
              'mode_keys': mode_keys,
              'branch_modes': sorted(branch_modes),
              'errors': errors,
          }
          Path('execution-path-audit.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          if errors:
              raise SystemExit(1)
          PY

          python -m compileall -q app.py config.py generators.py fetchers.py loaders.py scrapers.py data.py

          rm .github/workflows/audit-surviving-execution-paths.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record surviving execution path audit"
          git push origin HEAD:remove-data-management-runtime-fixes-v2
