name: AirNow and Envirofacts provider contracts

on:
  pull_request:
    paths:
      - fetchers.py
      - tests/test_airnow_envirofacts_contracts.py
      - .github/workflows/airnow-envirofacts-contracts.yml
  push:
    paths:
      - fetchers.py
      - tests/test_airnow_envirofacts_contracts.py
      - .github/workflows/airnow-envirofacts-contracts.yml

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile fetchers
        run: python -m py_compile fetchers.py
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -p 'test_airnow_envirofacts_contracts.py' -v
