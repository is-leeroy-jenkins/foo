name: NASA FIRMS and OpenSky provider contracts

on:
  pull_request:
    paths:
      - fetchers.py
      - tests/test_firms_opensky_contracts.py
      - .github/workflows/firms-opensky-contracts.yml
  push:
    paths:
      - fetchers.py
      - tests/test_firms_opensky_contracts.py
      - .github/workflows/firms-opensky-contracts.yml

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile production fetchers
        run: python -m py_compile fetchers.py
      - name: Execute isolated regressions
        run: python -m unittest discover -s tests -p 'test_firms_opensky_contracts.py' -v
