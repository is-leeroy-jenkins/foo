name: Build Foo Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -r desktop-requirements.txt
      - name: Install portable Chromium for Playwright
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $PWD 'playwright-browsers'
          python -m playwright install chromium
      - name: Compile launcher and application modules
        run: python -m compileall -q desktop.py app.py config.py
      - name: Create Foo executable
        run: python -m PyInstaller --noconfirm --clean foo.spec
      - name: Verify frozen executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Foo/Foo.exe")) { throw "Foo.exe is missing" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer/foo.iss"'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Foo-Windows-Installer
          path: dist-installer/*.exe
          if-no-files-found: error
